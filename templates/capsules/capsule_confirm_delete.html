{% extends 'base.html' %}

{% block title %}Delete Capsule - TimeCapsule{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">Confirm Delete</h3>
                </div>
                <div class="card-body text-center">
                    <p>Are you sure you want to delete the capsule <strong>"{{ capsule.title }}"</strong>?</p>
                    <p class="text-danger">This action cannot be undone!</p>

                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Yes, Delete</button>
                        <a href="{% url 'capsules:detail' capsule.pk %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
