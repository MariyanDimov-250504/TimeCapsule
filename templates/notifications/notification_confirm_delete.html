{% extends 'base.html' %}

{% block title %}Delete Notification - TimeCapsule{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">Delete Notification</h3>
                </div>
                <div class="card-body text-center">
                    <p>Are you sure you want to delete this notification?</p>
                    <p><strong>"{{ notification.title }}"</strong></p>
                    <p class="text-muted">{{ notification.message|truncatewords:20 }}</p>

                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Yes, Delete</button>
                        <a href="{% url 'notifications:list' %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
